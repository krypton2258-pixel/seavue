<style>
:root{
  --bg:#0F0B1E; --card:#1A1230; --card2:#241A3D; --line:#3A2C5C;
  --gold:#FFB44C; --pink:#FF4D9D; --cyan:#3DE2E6; --green:#5BE49B;
  --t1:#F5E6C8; --t2:#B9A7D6; --t3:#7C6BA0;
  --ink:#43402F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
body{min-height:100vh;overflow-x:hidden}
.scan{position:fixed;inset:0;z-index:9998;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.028) 0 1px,transparent 1px 3px)}
.grid-bg{position:fixed;left:0;right:0;bottom:0;height:38vh;z-index:0;pointer-events:none;opacity:.32;
  background-image:linear-gradient(rgba(255,180,76,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(255,77,157,.18) 1px,transparent 1px);
  background-size:100% 26px,26px 100%;transform:perspective(300px) rotateX(62deg);transform-origin:bottom}
.horizon{position:fixed;left:0;right:0;bottom:38vh;height:2px;z-index:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--gold),var(--pink),transparent);
  box-shadow:0 0 14px var(--gold),0 0 30px rgba(255,77,157,.6)}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:10px 14px;background:rgba(15,11,30,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
.brand{font-size:19px;font-weight:700;letter-spacing:2px;color:#fff;cursor:pointer;user-select:none;
  text-shadow:0 0 4px #fff,0 0 12px var(--gold),0 0 28px var(--pink)}
.brand .sub{font-size:10px;letter-spacing:3px;color:var(--t3);text-shadow:none;font-weight:400;margin-left:4px}
.topright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* 顾客端 / 店员端 双端切换器 */
.seg{display:flex;flex:none;border:1px solid rgba(255,180,76,.35);border-radius:99px;overflow:hidden;
  background:rgba(36,26,61,.85);box-shadow:0 0 10px rgba(255,180,76,.18)}
.seg button{border:none;border-radius:0;background:transparent;color:var(--t2);font-size:12px;
  padding:8px 14px;letter-spacing:1px;font-weight:600}
.seg button:hover{color:#fff}
.seg button.on{font-weight:700;color:#2A1708}
.seg button.on.c{background:linear-gradient(135deg,var(--cyan),#28BFC3);
  box-shadow:0 0 12px rgba(61,226,230,.5)}
.seg button.on.s{background:linear-gradient(135deg,var(--gold),#FF8A3D);
  box-shadow:0 0 12px rgba(255,180,76,.5)}
button{font-family:inherit;font-size:13px;color:var(--t1);background:var(--card2);border:1px solid var(--line);
  border-radius:9px;padding:7px 12px;cursor:pointer;transition:.15s}
button:hover{border-color:var(--gold);color:#fff}
button.primary{background:linear-gradient(135deg,var(--gold),#FF8A3D);color:#2A1708;border:none;font-weight:700;
  box-shadow:0 0 12px rgba(255,180,76,.5)}
button.danger{border-color:var(--pink);color:var(--pink)}
button.ghost{background:transparent}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{font-family:inherit;font-size:13px;color:var(--t1);background:var(--card2);
  border:1px solid var(--line);border-radius:9px;padding:7px 10px;outline:none;max-width:100%}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 8px rgba(255,180,76,.35)}
select option{background:var(--card2)}

/* tabs */
.tabs{position:relative;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 14px 4px}
.tabs button{flex:none;border-radius:99px;padding:6px 14px;font-size:13px;color:var(--t2);background:transparent}
.tabs button.on{color:#2A1708;background:linear-gradient(135deg,var(--gold),#FF8A3D);border:none;font-weight:700;
  box-shadow:0 0 12px rgba(255,180,76,.45)}
/* 品类锚点条（顾客端吸顶）：标签多了直接换行，不加横向滚动条 */
.tabs.anchors{position:sticky;top:53px;z-index:50;padding:8px 14px;margin:0;
  background:rgba(15,11,30,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  box-shadow:0 6px 18px rgba(0,0,0,.35);flex-wrap:wrap;overflow-x:visible}
.tabs.anchors button{background:var(--card2);border:1px solid var(--line);color:var(--t2);font-size:12px;padding:5px 12px}
.tabs.anchors button.on{color:#2A1708;border:none}
/* 品类分区 */
.catsec{scroll-margin-top:104px;padding-top:6px}
.cathead{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.cathead h3{margin:0;font-size:16px;letter-spacing:1px;color:#fff;white-space:nowrap;
  text-shadow:0 0 6px rgba(255,180,76,.55),0 0 16px rgba(255,77,157,.35)}
.cdot{width:4px;height:16px;border-radius:2px;background:linear-gradient(180deg,var(--gold),var(--pink));
  box-shadow:0 0 8px var(--gold)}
.cnum{font-size:11px;color:var(--t3);border:1px solid var(--line);border-radius:99px;padding:1px 8px;white-space:nowrap}
.cline{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
main{position:relative;z-index:5;padding:8px 14px 90px;max-width:1240px;margin:0 auto}
h2.sec{font-size:13px;color:var(--t3);font-weight:500;margin:18px 0 8px;letter-spacing:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* 酒款卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.beer{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;
  transition:.18s;position:relative;overflow:hidden}
.beer:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 6px 22px rgba(255,180,76,.18)}
.beer .thumb{display:flex;justify-content:center;height:104px}
.beer .nm{font-size:14px;font-weight:600;margin:4px 0 2px;text-align:center;line-height:1.35}
.fl{flex:none;width:82px;font-size:12px;color:var(--t2);text-align:left}
.beer .meta{font-size:11px;color:var(--t3)}
.beer .pr{color:var(--gold);font-weight:700;font-size:15px;margin-top:4px}
.beer .off{position:absolute;top:8px;right:8px;font-size:10px;color:var(--t3);border:1px solid var(--line);
  border-radius:99px;padding:1px 6px}
.beer.dim{opacity:.62}

/* 列表 */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--t3);font-weight:500;font-size:11px;letter-spacing:.5px}
td.num{color:var(--gold);font-weight:600}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--t2)}
.tag.unpaid{color:var(--gold);border-color:var(--gold);box-shadow:0 0 8px rgba(255,180,76,.3)}
.tag.paid{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 8px rgba(61,226,230,.3)}
.tag.void{color:var(--pink);border-color:var(--pink)}
.tag.off{color:var(--t3)}

/* 弹窗 */
.mask{position:fixed;inset:0;z-index:200;background:rgba(6,4,14,.82);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:14px}
.mask.on{display:flex}
.modal{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;width:100%;max-width:820px;
  max-height:92vh;overflow:auto;padding:16px;box-shadow:0 0 40px rgba(255,77,157,.18)}
.modal h3{margin:0 0 10px;font-size:17px}
/* 关闭按钮必须抬到最上层：后面接的 position:relative 内容块会盖住浮动元素，导致点不到 */
.x{float:right;position:relative;z-index:60;background:transparent;border:none;font-size:22px;
  color:var(--t3);padding:2px 10px;line-height:1;cursor:pointer}
.detail-wrap{display:flex;gap:16px;flex-wrap:wrap}
.detail-art{flex:none;width:230px;display:flex;flex-direction:column;align-items:center;gap:8px}
.arrow{position:absolute;top:42%;z-index:3;width:32px;height:32px;border-radius:50%;padding:0;
  background:rgba(36,26,61,.8);border:1px solid var(--line);font-size:15px}
.arrow.l{left:4px}.arrow.r{right:4px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:6px 0;border-top:1px solid var(--line);margin-top:8px}
.strip div{flex:none;width:38px;height:44px;border-radius:9px;border:1px solid var(--line);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:.15s;background:var(--card2)}
.strip div.on{border-color:var(--gold);box-shadow:0 0 10px rgba(255,180,76,.5);transform:scale(1.08)}
.kv{display:flex;gap:8px;margin:8px 0}
.kv div{flex:1;background:var(--card2);border-radius:10px;padding:6px 8px}
.kv p{margin:0;font-size:11px;color:var(--t3)}
.kv b{font-size:14px}
.sizebox{display:flex;gap:8px;margin-top:10px}
.sizebox button{flex:1;text-align:left;padding:10px}
.sizebox button.on{border-color:var(--gold);box-shadow:0 0 10px rgba(255,180,76,.4);background:rgba(255,180,76,.1)}

/* 动效 */
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.9}80%{opacity:.55}100%{transform:translateY(-104px);opacity:0}}
.bub{animation:rise 3.4s linear infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.1px)}}
.foamg{animation:breathe 3.6s ease-in-out infinite}
.body{transition:transform .5s cubic-bezier(.34,1.56,.64,1);transform-origin:60px 176px;transform-box:view-box}
.tilt{transition:transform .5s cubic-bezier(.34,1.56,.64,1);transform-origin:60px 176px;transform-box:view-box}
.art{transition:transform .45s cubic-bezier(.34,1.56,.64,1)}

/* 统计 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat p{margin:0;font-size:11px;color:var(--t3)}
.stat b{font-size:20px;color:var(--gold);text-shadow:0 0 10px rgba(255,180,76,.4)}
.barline{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
.barline .lb{flex:none;width:96px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barline .bar{flex:1;height:9px;background:var(--card2);border-radius:99px;overflow:hidden}
.barline .bar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--gold),var(--pink));box-shadow:0 0 8px rgba(255,180,76,.5)}
.barline .vl{flex:none;width:52px;text-align:right;color:var(--gold);font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--t2);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:9999;
  background:var(--card2);border:1px solid var(--gold);color:var(--t1);padding:9px 16px;border-radius:99px;
  font-size:13px;box-shadow:0 0 20px rgba(255,180,76,.4);opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.note{font-size:11px;color:var(--t3);line-height:1.6;margin:6px 0 0}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--gold)}
.fab{position:fixed;right:16px;bottom:18px;z-index:70;border-radius:99px;padding:12px 20px;display:none}
@media(max-width:760px){
  .fab{display:block}
  .detail-art{width:100%}
  .modal{padding:12px}
  .x{font-size:26px;padding:6px 12px}  /* 手机端加大点按区域 */
  /* 手机端顶栏收紧，保证切换器不挤到看不清 */
  .brand{font-size:15px;letter-spacing:1px}
  .brand .sub{display:none}
  .topbar{padding:8px 10px}
  .topright{gap:6px}
  #tableSel{max-width:78px;padding:6px 6px;font-size:12px}
  #cartBtn{font-size:12px;padding:6px 10px}
  .seg button{padding:7px 10px;font-size:11px}
}
</style>
</head>

var S=null;
function seed(){
  var beers=SEED.map(function(b,i){return{id:i+1,n:b.n,fn:"",cat:DEF_CATS[b.c],col:b.col,abv:b.abv,ibu:b.ibu,
    p:b.p,s:b.s,tag:b.tag,on:!b.off,offDate:b.off||"",hl:b.hl||0,hs:b.hs||0};});
  var orders=[],txns=[];
  var pays=["微信","支付宝","会员卡","现金","POS"];
  var now=new Date();
  for(var d=6;d>=0;d--){
    var day=new Date(now.getTime()-d*86400000);
    var cnt=4+Math.floor(Math.random()*5);
    for(var k=0;k<cnt;k++){
      var b=beers[Math.floor(Math.random()*beers.length)];
      var big=(!b.s)||Math.random()>0.35;   /* 单一规格的酒只出大杯 */
      var t=new Date(day.getTime()-(20-Math.floor(Math.random()*13))*3600000);
      var pay=pays[Math.floor(Math.random()*pays.length)];
      orders.push({oid:"S"+orders.length,beer:b.id,size:big?1:2,price:big?b.p:b.s,qty:1+Math.floor(Math.random()*2),
        table:(1+Math.floor(Math.random()*8))+"号桌",ts:t.getTime(),st:"paid",pay:pay,
        mem:pay==="会员卡"?"13800000001":""});
    }
  }
  var mems=[
    {phone:"13800000001",name:"张伟",bal:620,tr:1500,tc:880,ts:now.getTime()-42*86400000},
    {phone:"13900000002",name:"李娜",bal:180,tr:500,tc:320,ts:now.getTime()-21*86400000},
    {phone:"13700000003",name:"王强",bal:0,tr:300,tc:300,ts:now.getTime()-6*86400000}
  ];
  mems.forEach(function(m){
    txns.push({id:"T"+txns.length,phone:m.phone,type:"充值",amt:m.tr,bonus:bonusOf(m.tr),before:0,
      after:m.tr+bonusOf(m.tr),ts:m.ts,memo:"开卡充值",op:"店长"});
  });
  return{beers:beers,orders:orders,mems:mems,txns:txns,notes:{},
    tables:DEF_TABLES.slice(),cats:DEF_CATS.slice(),rules:DEF_RULES.map(function(r){return r.slice();}),
    staffs:DEF_STAFFS.slice(),cps:[],gcp:{},cplog:[]};
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);}}catch(e){S=null;}
  if(!S||!S.beers){S=seed();}
  if(!S.notes)S.notes={};
  if(!S.tables||!S.tables.length)S.tables=DEF_TABLES.slice();
  if(!S.cats||!S.cats.length)S.cats=DEF_CATS.slice();
  if(!S.rules)S.rules=DEF_RULES.map(function(r){return r.slice();});
  if(!S.staffs||!S.staffs.length)S.staffs=DEF_STAFFS.slice();
  if(!S.cps)S.cps=[];
  if(!S.gcp)S.gcp={};
  if(!S.cplog)S.cplog=[];
  /* 券结构升级：旧的商品券只有单个 beer/cname/size/cups，统一成 items 数组 */
  S.cps.forEach(function(c){
    if(c.type!=="amt"&&!c.items)c.items=[{beer:c.beer||0,cname:c.cname||"",size:c.size||1,cups:c.cups||1}];
    if(c.type==="amt"&&c.cost==null)c.cost=0;
  });
  save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ============ 工具 ============ */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function money(n){return "¥"+(Math.round(n*100)/100).toFixed(0);}
function fmt(ts){var d=new Date(ts);return (d.getMonth()+1)+"/"+d.getDate()+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}
function dayKey(ts){var d=new Date(ts);return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
var toastT;
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("on");},1900);}
function lum(hex){var r=parseInt(hex.substr(1,2),16),g=parseInt(hex.substr(3,2),16),b=parseInt(hex.substr(5,2),16);return(r*299+g*587+b*114)/1000;}

/* ============ 酒杯 SVG（水彩手绘风 · 锥形直杯 · 满杯 · 云朵酒头不外溢 · 霓虹光晕） ============ */
function glass(col,opt){
  opt=opt||{};
  var w=opt.w||120, bubbles=!!opt.bubbles, id=opt.id||"g"+Math.random().toString(36).slice(2,7);
  var op=lum(col)>150?0.52:(lum(col)>90?0.66:0.86);
  var b="";
  if(bubbles){
    var bs=[[45,3.0,0],[52,2.1,.7],[59,2.7,1.5],[66,2.2,2.3],[73,1.9,.4],[48,1.8,2.9],
            [56,2.4,3.4],[63,2.0,1.1],[70,1.6,2.0],[54,1.5,1.8]];
    for(var i=0;i<bs.length;i++){
      b+='<circle class="bub" cx="'+bs[i][0]+'" cy="170" r="'+bs[i][1]+'" fill="#FFFFFF" fill-opacity=".55" '+
         'stroke="#FFFFFF" stroke-opacity=".8" stroke-width=".4" style="animation-delay:'+bs[i][2]+'s"/>';
    }
  }
  return '<svg viewBox="0 0 120 200" width="'+w+'" class="art" aria-hidden="true">'+
  '<defs><clipPath id="c'+id+'"><path d="M25 34 L35 172 Q36 178 42 178 L78 178 Q84 178 85 172 L95 34 Z"/></clipPath></defs>'+
  /* 霓虹光晕背景（多层同心，无滤镜） */
  '<ellipse cx="60" cy="96" rx="56" ry="60" fill="#FFB44C" fill-opacity=".09"/>'+
  '<ellipse cx="60" cy="96" rx="44" ry="48" fill="#FF8A3D" fill-opacity=".09"/>'+
  '<ellipse cx="60" cy="96" rx="33" ry="37" fill="#FF4D9D" fill-opacity=".07"/>'+
  '<ellipse cx="60" cy="100" rx="24" ry="28" fill="#C77BFF" fill-opacity=".06"/>'+
  /* 排线投影（不参与摇晃） */
  '<g stroke="#43402F" stroke-opacity=".35" stroke-width="1" stroke-linecap="round">'+
    '<path d="M30 186 L54 185"/><path d="M60 187 L88 186"/><path d="M42 190 L70 189"/><path d="M74 191 L92 190"/></g>'+
  /* 整杯（杯身 + 酒液 + 泡沫）统一倾斜，杜绝酒体与杯子分离 */
  '<g class="tilt">'+
  /* 酒体：在整杯基础上做小幅反向补偿，表现酒液荡起 */
  '<g class="body">'+
    '<g clip-path="url(#c'+id+')">'+
      '<rect x="20" y="46" width="80" height="140" fill="'+col+'" fill-opacity="'+op+'"/>'+
      '<rect x="20" y="46" width="80" height="140" fill="'+col+'" fill-opacity=".18"/>'+
      /* 暗部晕染（左右内侧，随杯壁内收） */
      '<path d="M27 40 L36 174" stroke="#43402F" stroke-opacity=".22" stroke-width="7" fill="none"/>'+
      '<path d="M93 40 L84 174" stroke="#43402F" stroke-opacity=".18" stroke-width="6" fill="none"/>'+
      '<path d="M33 172 Q60 182 87 172" stroke="#43402F" stroke-opacity=".25" stroke-width="5" fill="none" stroke-linecap="round"/>'+
      b+
      /* 主高光（白色，沿杯壁） */
      '<path d="M31 42 L39 170" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="3.4" stroke-linecap="round" fill="none"/>'+
      '<path d="M37 44 L44 160" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="1.6" stroke-linecap="round" fill="none"/>'+
      '<path d="M89 44 L83 128" stroke="#FFFFFF" stroke-opacity=".3" stroke-width="2" stroke-linecap="round" fill="none"/>'+
      /* 液面 */
      '<path d="M26 47 Q60 52 94 47" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="1.6" fill="none"/>'+
    '</g>'+
    /* 云朵酒头：底边与酒体水平面同一条曲线（严丝合缝），云朵只向上生长，不越杯壁、不高于杯沿 */
    '<g class="foamg">'+
      '<path d="M26 47 Q60 52 94 47 Q94 41 87 43 Q81 35 73 40 Q65 33 57 39 Q49 33 41 39 Q33 35 29 42 Q26 43 26 47 Z" '+
        'fill="#FFF6E0" fill-opacity=".95" stroke="#43402F" stroke-opacity=".5" stroke-width="1"/>'+
      '<path d="M34 44 Q46 40 58 43" stroke="#E8DDBE" stroke-opacity=".8" stroke-width="1" fill="none"/>'+
      '<path d="M62 43 Q76 39 86 43" stroke="#E8DDBE" stroke-opacity=".7" stroke-width="1" fill="none"/>'+
    '</g>'+
  '</g>'+
  /* 杯体玻璃：与酒体同属一个倾斜组，摇晃时整杯同步，绝不分离 */
  '<path d="M25 34 L35 172 Q36 178 42 178 L78 178 Q84 178 85 172 L95 34" fill="none" stroke="#43402F" stroke-opacity=".72" stroke-width="1.8" stroke-linejoin="round"/>'+
  '<ellipse cx="60" cy="34" rx="35" ry="5" fill="none" stroke="#43402F" stroke-opacity=".6" stroke-width="1.4"/>'+
  '<path d="M25.5 34 A35 5 0 0 1 94.5 34" fill="none" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="1.6"/>'+
  '<g fill="#FFFFFF" fill-opacity=".45"><circle cx="47" cy="96" r="1.4"/><circle cx="51" cy="126" r="1"/>'+
   '<circle cx="74" cy="108" r="1.2"/><circle cx="70" cy="146" r="1"/><circle cx="58" cy="158" r="1.1"/></g>'+
  '</g>'+
  '</svg>';
}

/* 顾客端：单页全品类，点锚点快速定位 */
function goCat(c){
  var el=document.getElementById("cat-"+c);
  if(el)el.scrollIntoView({behavior:"smooth",block:"start"});
  V.cat=c;markAnchor();
}
function markAnchor(){
  var bs=$("tabs").querySelectorAll("button");
  for(var i=0;i<bs.length;i++){
    var on=bs[i].getAttribute("data-c")===V.cat;
    bs[i].classList.toggle("on",on);
    if(on&&bs[i].scrollIntoView){var b=bs[i];
      var p=b.parentNode,pl=p.scrollWidth>p.clientWidth;
      if(pl)p.scrollLeft=Math.max(0,b.offsetLeft-p.clientWidth/2+b.offsetWidth/2);}
  }
}
function syncAnchor(){
  if(V.mode!=="customer")return;
  var secs=document.querySelectorAll(".catsec");
  if(!secs.length)return;
  var y=window.scrollY+140,cur=null;
  for(var i=0;i<secs.length;i++){if(secs[i].offsetTop<=y)cur=secs[i];}
  if(cur&&cur.getAttribute("data-cat")!==V.cat){V.cat=cur.getAttribute("data-cat");markAnchor();}
}

/* 模糊查询：支持手机号片段或姓名片段 */
function memFind(q){
  q=(q==null?"":String(q)).trim();
  if(!q)return [];
  var hit=[],exact=null;
  S.mems.forEach(function(m){
    var inP=m.phone.indexOf(q)>=0,inN=(m.name||"").indexOf(q)>=0;
    if(inP||inN){hit.push(m);if(!exact&&(m.phone===q||m.name===q))exact=m;}
  });
  if(exact){hit=[exact].concat(hit.filter(function(m){return m!==exact;}));}
  return hit;
}

function gcStep(id,d){
  var c=cpOf(id);if(!c)return;
  var n=Math.max(0,(_gc[id]||0)+d);
  if(n>c.stock){toast("库存不足，仅剩 "+c.stock+" 张");return;}

function doGoodsCp(t){
  var used=[];
  Object.keys(_gc).forEach(function(k){
    var c=cpOf(k);if(!c||!_gc[k])return;
    var n=Math.min(_gc[k],c.stock);if(n<=0)return;
    c.stock-=n;c.used=(c.used||0)+n;
    used.push({id:k,n:n,name:c.name,val:cpVal(c)*n,type:c.type||"goods"});
    cpLog(k,c.name,c.type||"goods",n,cpVal(c)*n);
  });
  if(!used.length){toast("请先选择要用的商品券");return;}
  if(!S.gcp)S.gcp={};
  S.gcp[t]=(S.gcp[t]||[]).concat(used);
  var sum=used.reduce(function(a,u){return a+u.val;},0);
  save();closeMem();renderView();toast("已使用商品券抵扣 "+money(sum));
}
function updPay(){

  });

  var mm=memOf(window._memPhone);

function doPay(){
  var gross=window._sum||0,cut=cpCut(),due=Math.max(0,gross-cut),t=window._table||"";
  var rv=parseFloat($("payReal").value);
  if(isNaN(rv)||rv<0)rv=due;
  var real=rv,pay=window._pay,phone="";
  if(pay==="会员卡"){
    phone=window._memPhone||($("payPhone")?$("payPhone").value.trim():"");
    var m=memFind(phone)[0]||memOf(phone);
    if(!m){toast("请查询并点选一位会员");return;}
    phone=m.phone;
    if(m.bal<real){toast("余额不足，当前 "+money(m.bal));return;}
    m.bal-=real;m.tc+=real;
    S.txns.push({id:"T"+S.txns.length,phone:m.phone,type:"消费",amt:-real,bonus:0,before:m.bal+real,after:m.bal,
      ts:Date.now(),memo:"结账消费"});
  }
  var cpSum=[];
  /* 本单在点单页用过的商品券 / 任意品类券，也记进券名 */
  if(t&&S.gcp&&S.gcp[t])S.gcp[t].forEach(function(u){cpSum.push(u.name+" × "+(u.n||1));});
  Object.keys(_cpUse).forEach(function(k){
    var c=cpOf(k);if(!c)return;
    var n=Math.min(_cpUse[k]||0,c.stock);if(n<=0)return;
    c.stock-=n;c.used=(c.used||0)+n;
    cpSum.push(c.name+" × "+n);
    cpLog(k,c.name,c.type||"amt",n,cpVal(c)*n);
  });
  if(due<=0.001){
    /* 券已全额覆盖：不收钱，整单直接结清，支付方式记为「代金券」 */
    window._sel.forEach(function(oid){
      var o=null;S.orders.forEach(function(x){if(x.oid===oid)o=x;});
      if(!o)return;
      o.paidAmt=o.price*o.qty;o.st="paid";o.pay="代金券";o.ts2=Date.now();o.mem="";
      if(cpSum.length)o.cps=cpSum.join("，");
      o.snote=t?(S.notes[t]||""):(o.snote||"");
    });
  }else{
    var left=real;
    window._sel.forEach(function(oid){
      var o=null;S.orders.forEach(function(x){if(x.oid===oid)o=x;});
      if(!o)return;
      if(cpSum.length)o.cps=cpSum.join("，");
      o.mem=phone;
      if(left<=0)return;
      var rem=Math.max(0,o.price*o.qty-(o.paidAmt||0));
      if(rem<=0)return;
      if(left>=rem-0.001){o.paidAmt=o.price*o.qty;o.st="paid";o.pay=pay;o.ts2=Date.now();left-=rem;}
      else{o.paidAmt=(o.paidAmt||0)+left;left=0;}
      o.snote=t?(S.notes[t]||""):(o.snote||"");
    });
  }
  if(t){
    if(S.gcp)delete S.gcp[t];
    var still=S.orders.filter(function(o){return o.st==="unpaid"&&o.table===t;}).length;
    if(!still)delete S.notes[t];
  }
  /* 券抵扣记入本单第一条，供报表统计；实际抵扣以本单金额为上限（用大额券时不会虚增） */
  var cpFace=Math.min(cut,gross),fid=window._sel&&window._sel[0];
  if(cpFace>0.001&&fid){
    S.orders.forEach(function(o){
      if(o.oid!==fid)return;
      o.cpAmt=(o.cpAmt||0)+cpFace;
      if(cpSum.length)o.cpNames=cpSum.join("，");
    });
  }
  save();closePay();$("bigMask").classList.remove("on");renderView();
  var rest=Math.max(0,due-real);
  toast(rest>0.001?("已收 "+money(real)+"，还剩 "+money(rest)+" 挂在待结账"):("已结账 "+money(real)+" · "+pay));
}

function rangeOrders(){
  var f=RANGE.from?new Date(RANGE.from+"T00:00:00").getTime():Date.now()-6*86400000;
  var t=RANGE.to?new Date(RANGE.to+"T23:59:59").getTime():Date.now();
  /* 以「结账时间」为准（未结账不计入），保证今日账单实时同步 */
  return S.orders.filter(function(o){var ts=o.ts2||o.ts;return o.st==="paid"&&ts>=f&&ts<=t;});
}
function setRange(lbl,d1,d2){
  var now=new Date();
  if(lbl==="近 7 天"){RANGE.from=dayKey(now.getTime()-6*86400000);RANGE.to=dayKey(now.getTime());}
  else if(lbl==="今日"){RANGE.from=RANGE.to=dayKey(now.getTime());}
  else if(lbl==="昨日"){RANGE.from=RANGE.to=dayKey(now.getTime()-86400000);}
  else if(lbl==="本月"){RANGE.from=now.getFullYear()+"-"+("0"+(now.getMonth()+1)).slice(-2)+"-01";RANGE.to=dayKey(now.getTime());}
  else if(lbl==="全部"){RANGE.from="2020-01-01";RANGE.to=dayKey(now.getTime());}
  else {RANGE.from=d1;RANGE.to=d2;}
  RANGE.label=lbl;renderView();
}

function donut(arr,total){
  var r=42,c=2*Math.PI*r,off=0,g="";
  var cols=["#FFB44C","#3DE2E6","#5BE49B","#FF4D9D","#C77BFF"];
  arr.forEach(function(p,i){
    var len=total?p.v/total*c:0;
    g+='<circle cx="52" cy="52" r="'+r+'" fill="none" stroke="'+cols[i%5]+'" stroke-width="16" '+
       'stroke-dasharray="'+len+' '+(c-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 52 52)"/>';
    off+=len;
  });
  return '<svg viewBox="0 0 104 104" width="130" flex="none">'+g+
    '<text x="52" y="50" text-anchor="middle" fill="#F5E6C8" font-size="11">营业额</text>'+
    '<text x="52" y="66" text-anchor="middle" fill="#FFB44C" font-size="13" font-weight="bold">'+money(total)+'</text></svg>';
}

function viewRank(){
  var os=rangeOrders();
  var map={};
  S.beers.forEach(function(b){map[b.id]={b:b,l:0,s:0,hl:b.hl||0,hs:b.hs||0,amt:0};});
  os.forEach(function(o){
    if(!map[o.beer])return;
    if(o.size===1)map[o.beer].l+=o.qty;else map[o.beer].s+=o.qty;
    map[o.beer].amt+=paidOf(o);
  });
  var arr=Object.keys(map).map(function(k){return map[k];});
  var byCup=arr.slice().sort(function(a,b){return (b.l+b.s)-(a.l+a.s);});
  var byAmt=arr.slice().sort(function(a,b){return b.amt-a.amt;});
  var mx=byCup[0]?(byCup[0].l+byCup[0].s):1;
  var h='<div class="card" style="margin-bottom:12px"><div class="row" style="align-items:center;gap:8px"><b>排行区间</b>'+
    ["今日","昨日","近 7 天","本月","全部"].map(function(l){
      return '<button class="'+(RANGE.label===l?"primary":"")+'" onclick="setRange(\''+l+'\')">'+l+'</button>';}).join("")+
    '<span class="note" style="margin:0">'+esc(RANGE.from||"-")+' 至 '+esc(RANGE.to||"-")+
    ' · 只统计本区间内结账的订单，与报表同口径</span></div></div>';
  h+='<h2 class="sec">杯数排行（当前区间 · 含已下架酒款）</h2><div class="card">';
  byCup.slice(0,12).forEach(function(x,i){
    var tot=x.l+x.s;
    h+='<div class="barline"><span class="lb" style="width:34px;color:var(--gold)">'+(i+1)+'</span>'+
      '<span class="lb" style="width:120px">'+esc(x.b.n)+(x.b.on?'':' <span class="tag off">已下架</span>')+'</span>'+
      '<span class="bar"><i style="width:'+Math.round(tot/mx*100)+'%"></i></span>'+
      '<span class="vl">'+tot+' 杯</span>'+
      '<span class="note" style="width:120px;margin:0">区间 大'+x.l+'/小'+x.s+
      ' · 历史 '+(x.hl+x.hs)+'</span></div>';
  });
  h+='<p class="note">排行只按所选区间内已结账订单统计（与统计报表同口径，切换「今日 / 近 7 天」数字会对得上）；「历史」是该酒款录入时的存量累计销量，单独展示、不混进排行，用于判断老酒是否值得回归。</p></div>';
  h+='<h2 class="sec">销售额排行（当前区间）</h2><div class="card">';
  byAmt.slice(0,10).forEach(function(x,i){
    h+='<div class="barline"><span class="lb" style="width:34px;color:var(--gold)">'+(i+1)+'</span>'+
      '<span class="lb" style="width:120px">'+esc(x.b.n)+(x.b.on?'':' <span class="tag off">已下架</span>')+'</span>'+
      '<span class="bar"><i style="width:'+Math.round(x.amt/(byAmt[0].amt||1)*100)+'%"></i></span>'+
      '<span class="vl">'+money(x.amt)+'</span></div>';
  });
  h+='</div>';
  return h;
}

}

/* ---- 代金券 ---- */
function cpOf(id){for(var i=0;i<S.cps.length;i++)if(S.cps[i].id===id)return S.cps[i];return null;}
/* 券面值：金额券=可抵金额；商品券 / 任意品类券=券面值（创建时手填，结账按此抵扣） */
function cpVal(c){return c?(c.val||0):0;}
/* 金额券售价：「多少代多少」里的"多少" */
function cpCost(c){return c&&c.cost?c.cost:0;}
/* 商品券内含的多个品类（兼容旧的单商品券结构） */
function cpItems(c){
  if(!c)return [];
  if(c.items&&c.items.length)return c.items;
  if(c.beer||c.cname)return [{beer:c.beer||0,cname:c.cname||"",size:c.size||1,cups:c.cups||1}];
  return [];
}
function cpItemName(it){
  if(it&&it.beer){var b=beerOf(it.beer);if(b)return b.n;}
  return (it&&it.cname)?it.cname:"自定义商品";
}
function cpTypeName(c){
  if(!c)return "";
  if(c.type==="amt")return "金额券";
  if(c.type==="any")return "任意品类券";
  return "商品券";
}
function cpText(c){
  if(!c)return "";
  if(c.type==="amt")return (cpCost(c)>0?("售 "+money(cpCost(c))+" 抵 "):"抵 ")+money(c.val);
  if(c.type==="any")return "代 "+money(c.limit||0)+" 元以内任意酒水 × "+(c.cups||1)+" 杯 · 面值 "+money(c.val);
  var its=cpItems(c);
  if(!its.length)return "面值 "+money(c.val);
  return its.map(function(it){
    return esc(cpItemName(it))+" · "+(it.size===2?"小杯 330ml":"大杯 475ml")+" × "+(it.cups||1);
  }).join(" ＋ ")+" · 面值 "+money(c.val);
}
/* 券使用流水（报表用） */
function cpLog(id,name,type,n,val){
  if(!S.cplog)S.cplog=[];
  S.cplog.push({ts:Date.now(),id:id,name:name,type:type||"",n:n||0,val:val||0});
}
/* 酒款下拉（含已下架，避免编辑旧券时选不中） */
function cpBeerOpts(sel){
  var h=S.beers.map(function(b){
    return '<option value="'+b.id+'"'+(String(sel||"")===String(b.id)?" selected":"")+'>'+esc(b.n)+(b.on?"":"（已下架）")+'</option>';
  }).join("");
  return h+'<option value="0"'+((!sel)?" selected":"")+'>＋ 自定义（不在酒单里的商品）</option>';
}
/* 商品券里的一个「品类行」 */
function cpRowHTML(i,it){
  it=it||{beer:0,cname:"",size:1,cups:1};

    '<div class="row" style="align-items:center"><span class="fl">品类 '+(i+1)+'</span>'+
      '<select data-k="beer" style="flex:1" onchange="cpRowCustom('+i+')">'+cpBeerOpts(it.beer)+'</select>'+
      (i>0?'<button class="ghost" style="padding:4px 9px;color:var(--pink)" onclick="cpDelRow('+i+')">删</button>':'')+
    '</div>'+
    '<div class="row" data-k="cnrow" style="align-items:center;margin-top:6px'+(custom?"":";display:none")+'">'+
      '<span class="fl">自定义名称</span>'+
      '<input data-k="cname" placeholder="如：精酿小吃拼盘 / 限定联名杯" value="'+esc(it.cname||"")+'" style="flex:1"></div>'+
    '<div class="row" style="align-items:center;margin-top:6px"><span class="fl">规格</span>'+
      '<select data-k="size" style="flex:1">'+
        '<option value="1"'+(it.size===2?"":" selected")+'>大杯 475ml</option>'+
        '<option value="2"'+(it.size===2?" selected":"")+'>小杯 330ml</option></select></div>'+
    '<div class="row" style="align-items:center;margin-top:6px"><span class="fl">杯数</span>'+
      '<input data-k="cups" type="number" min="1" value="'+(it.cups||1)+'" style="flex:1"></div>'+

  var row=document.querySelector('.cpitem[data-i="'+i+'"]');if(!row)return;
  var sel=row.querySelector('[data-k="beer"]'),cr=row.querySelector('[data-k="cnrow"]');

/* ＋ 增加品类 / 商品 */
function cpAddRow(){
  var box=$("cfItems");if(!box)return;
  var n=box.querySelectorAll(".cpitem").length;
  box.insertAdjacentHTML("beforeend",cpRowHTML(n,{beer:0,cname:"",size:1,cups:1}));
  toast("已增加 1 个品类");
}
function cpReadRow(row){
  var g=function(k){var e=row.querySelector('[data-k="'+k+'"]');return e?e.value:"";};
  return {beer:parseInt(g("beer"),10)||0,cname:(g("cname")||"").trim(),
    size:parseInt(g("size"),10)||1,cups:Math.max(1,parseInt(g("cups"),10)||1)};
}
function cpReadItems(){
  var box=$("cfItems");if(!box)return [];
  var rows=box.querySelectorAll(".cpitem"),arr=[];
  for(var i=0;i<rows.length;i++)arr.push(cpReadRow(rows[i]));
  return arr;
}
function cpDelRow(i){
  var box=$("cfItems");if(!box)return;
  var rows=box.querySelectorAll(".cpitem"),arr=[];
  for(var k=0;k<rows.length;k++){if(parseInt(rows[k].getAttribute("data-i"),10)===i)continue;arr.push(cpReadRow(rows[k]));}
  if(!arr.length)arr=[{beer:0,cname:"",size:1,cups:1}];
  box.innerHTML=arr.map(function(it,j){return cpRowHTML(j,it);}).join("");
}

function saveCp(id,type){
  var n=($("cfN")?$("cfN").value:"")||"";n=n.trim();
  if(!n){toast("请填写券名称");return;}
  var stock=parseInt($("cfS")?$("cfS").value:0,10);if(!(stock>0))stock=0;
  var v=function(e){return parseFloat(e?e.value:NaN);};
  var d={name:n,type:type,stock:stock,note:(($("cfM")?$("cfM").value:"")||"").trim(),
    val:0,cost:0,limit:0,cups:0,items:[]};
  if(type==="amt"){
    var val=v($("cfV"));
    if(!(val>0)){toast("请填写抵扣面额");return;}
    var co=v($("cfC"));if(isNaN(co)||co<0)co=0;
    d.val=val;d.cost=co;
  }else if(type==="any"){
    var val2=v($("cfV"));
    if(!(val2>0)){toast("请填写券面值（结账时抵扣的金额）");return;}
    var lm=v($("cfL"));
    if(!(lm>0)){toast("请填写单价上限（代多少元以内）");return;}
    d.val=val2;d.limit=lm;d.cups=Math.max(1,parseInt($("cfC")?$("cfC").value:1,10)||1);
  }else{
    var its=cpReadItems(),ok=[];
    if(!its.length){toast("请至少添加一个品类");return;}
    for(var i=0;i<its.length;i++){
      if(!its[i].beer&&!its[i].cname){toast("第 "+(i+1)+" 个品类：请选择酒款，或填写自定义名称");return;}
      ok.push(its[i]);
    }
    var val3=v($("cfV"));
    if(!(val3>0)){toast("请填写券面值（结账时抵扣的金额）");return;}
    d.val=val3;d.items=ok;
    d.cups=ok.reduce(function(a,it){return a+(it.cups||1);},0);
  }
  var c=id?cpOf(id):null;
  if(c){
    /* 整份字段覆盖写回，避免规格/自定义名等漏存导致"编辑保存不了" */
    c.name=d.name;c.type=d.type;c.val=d.val;c.cost=d.cost;c.limit=d.limit;
    c.cups=d.cups;c.items=d.items;c.stock=d.stock;c.note=d.note;
    c.beer=0;c.cname="";c.size=0;   /* 清掉旧的单商品字段，展示一律走 items */
    toast("已保存修改");
  }else{
    d.id="C"+(S.cps.length+1)+"_"+Date.now();d.ts=Date.now();d.used=0;
    S.cps.push(d);toast("已创建："+n);
  }
  save();closeMem();renderView();
}

  S.cps=S.cps.filter(function(c){return c.id!==id;});
  save();renderView();toast("已删除该代金券");
}

  h+='<div class="card"><b>金额代金券（多少代多少）</b><div style="overflow-x:auto;margin-top:8px"><table>'+
    '<tr><th>券名称</th><th>售价</th><th>抵扣面额</th><th>发放</th><th>备注</th><th></th></tr>';
  var amt=S.cps.filter(function(c){return c.type==="amt";});
  if(!amt.length)h+=cpEmpty(6,"还没有金额代金券，点上方「+ 金额代金券」创建。");
  amt.forEach(function(c){
    h+='<tr><td>'+esc(c.name)+'</td>'+
      '<td class="num">'+(cpCost(c)>0?money(cpCost(c)):'<span style="color:var(--t3)">免费发放</span>')+'</td>'+
      '<td class="num" style="color:var(--green)">'+money(c.val)+'</td><td>'+(c.stock||0)+' 张</td>'+
      '<td>'+esc(c.note||"-")+'</td><td>'+cpRowBtns(c)+'</td></tr>';
  });
  h+='</table></div></div>';
  /* 商品券 */
  h+='<div class="card" style="margin-top:12px"><b>商品代金券（一张券可含多个品类）</b>'+
    '<div style="overflow-x:auto;margin-top:8px"><table>'+
    '<tr><th>券名称</th><th>兑换内容</th><th>券面值</th><th>发放</th><th>备注</th><th></th></tr>';
  var gd=S.cps.filter(function(c){return c.type!=="amt"&&c.type!=="any";});
  if(!gd.length)h+=cpEmpty(6,"还没有商品代金券，点上方「+ 商品代金券」创建。");
  gd.forEach(function(c){
    h+='<tr><td>'+esc(c.name)+'</td><td style="font-size:12px;line-height:1.6">'+cpText(c)+'</td>'+
      '<td class="num" style="color:var(--green)">'+money(c.val)+'</td><td>'+(c.stock||0)+' 张</td>'+
      '<td>'+esc(c.note||"-")+'</td><td>'+cpRowBtns(c)+'</td></tr>';
  });
  h+='</table></div></div>';
  /* 任意品类券 */
  h+='<div class="card" style="margin-top:12px"><b>任意品类券（代 X 元以内的任意酒水 N 杯）</b>'+
    '<div style="overflow-x:auto;margin-top:8px"><table>'+
    '<tr><th>券名称</th><th>兑换内容</th><th>券面值</th><th>发放</th><th>备注</th><th></th></tr>';
  var an=S.cps.filter(function(c){return c.type==="any";});
  if(!an.length)h+=cpEmpty(6,"还没有任意品类券，点上方「+ 任意品类券」创建。");
  an.forEach(function(c){
    h+='<tr><td>'+esc(c.name)+'</td><td style="font-size:12px;line-height:1.6">'+cpText(c)+'</td>'+
      '<td class="num" style="color:var(--green)">'+money(c.val)+'</td><td>'+(c.stock||0)+' 张</td>'+
      '<td>'+esc(c.note||"-")+'</td><td>'+cpRowBtns(c)+'</td></tr>';
  });
  h+='</table></div></div>';
  h+='<p class="note">金额券在结账弹窗里选「用几张」直接抵钱；商品券与任意品类券都在店员端「点单 / 结账」页点客单上的「商品券」按钮使用，按券面值抵扣该客单应付。</p>';
  return h;
}

/* ---- 详情弹窗 ---- */
function openDetail(id){
  var b=beerOf(id);if(!b)return;
  V.detail=id;V.dsel=1;V.num=1;
  $("detailBox").innerHTML=detailHTML(b);
  $("detailMask").classList.add("on");
  bindSwipe();
}
function closeDetail(){$("detailMask").classList.remove("on");V.detail=-1;}
function catBeers(cat){return S.beers.filter(function(b){return b.cat===cat&&b.on;});}
function detailHTML(b){
  var list=catBeers(b.cat),idx=list.map(function(x){return x.id;}).indexOf(b.id);
  var h='<button class="x" onclick="closeDetail()">×</button>'+
    '<div style="position:relative"><div class="detail-wrap">'+
    '<div class="detail-art"><button class="arrow l" onclick="swipe(-1)">‹</button>'+
    '<button class="arrow r" onclick="swipe(1)">›</button>'+
    '<div id="artBox">'+glass(b.col,{w:170,bubbles:true,id:"d"+b.id})+'</div>'+
    '<div style="font-size:11px;color:var(--t3)">← 左右滑动切换 · 酒体跟手摇晃 →</div></div>'+
    '<div class="grow" style="min-width:200px">'+
      '<p style="margin:0;font-size:12px;color:var(--t3)">'+esc(b.cat)+'</p>'+
      '<div class="row" style="align-items:baseline;gap:8px;flex-wrap:wrap">'+
        '<h3 style="margin:0">'+esc(b.n)+'</h3>'+
        (b.fn?'<span style="font-size:12px;color:var(--t3);line-height:1.4">'+esc(b.fn)+'</span>':'')+
      '</div>'+
      '<div class="kv"><div><p>ABV 酒精度</p><b>'+esc(nv(b.abv))+'</b></div><div><p>IBU 苦度</p><b>'+esc(nv(b.ibu))+'</b></div>'+
        '<div><p>标准规格</p><b>475ml</b></div></div>'+
      '<p style="font-size:13px;color:var(--t2);margin:6px 0 0">'+esc(nv(b.tag))+'</p>'+
      '<div class="kv"><div><p>标准价（475ml）</p><b style="color:var(--gold)">'+money(b.p)+'</b></div></div>'+
      sizeHTML(b)+
      '<div class="row" style="margin-top:10px;align-items:center;gap:8px">'+
        '<span style="font-size:12px;color:var(--t2)">数量</span>'+
        '<button style="padding:6px 12px;font-size:16px" onclick="chgNum(-1)">−</button>'+
        '<b id="numVal" style="min-width:30px;text-align:center;font-size:16px">'+(V.num||1)+'</b>'+
        '<button style="padding:6px 12px;font-size:16px" onclick="chgNum(1)">+</button>'+
        '<button class="grow primary" onclick="confirmAdd('+b.id+')">加入点单</button></div>'+
      '<p class="note">展示页只显示 475ml 标准价；上面的规格和数量选好后，点右侧按钮一次加入（想点几杯就把数量加到几）。</p>'+
    '</div></div>'+
    '<div class="strip" id="strip">';
  list.forEach(function(x,i){
    h+='<div class="'+(x.id===b.id?"on":"")+'" onclick="goBeer('+x.id+')" title="'+esc(x.n)+'">'+thumb(x.col,30)+'</div>';
  });
  h+='</div></div>';
  return h;
}
function goBeer(id){var b=beerOf(id);if(!b)return;V.detail=id;V.num=1;$("detailBox").innerHTML=detailHTML(b);bindSwipe();}
function swipe(dir){
  var b=beerOf(V.detail);if(!b)return;
  var list=catBeers(b.cat),idx=list.map(function(x){return x.id;}).indexOf(b.id);
  var nx=list[(idx+dir+list.length)%list.length];if(!nx||nx.id===b.id)return;
  // 摇晃动效：整杯（杯身+酒液+泡沫）一起倾斜，酒液小幅反向补偿表现荡起，随后回弹归位
  var box=$("artBox");
  if(box)slosh(box,dir*9,dir*-3.5,dir*16);
  setTimeout(function(){
    var nb=beerOf(nx.id);V.detail=nx.id;
    $("detailBox").innerHTML=detailHTML(nb);bindSwipe();
    var box2=$("artBox");
    if(box2){
      var tilt2=box2.querySelector(".tilt"),body2=box2.querySelector(".body"),art2=box2.querySelector(".art");
      if(art2){art2.style.transition="none";art2.style.transform="translateX("+(-dir*22)+"px)";}
      if(tilt2){tilt2.style.transition="none";tilt2.style.transform="rotate("+(-dir*7)+"deg)";}
      if(body2){body2.style.transition="none";body2.style.transform="rotate("+(dir*2.5)+"deg)";}
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          if(art2){art2.style.transition="";art2.style.transform="translateX(0)";}
          if(tilt2){tilt2.style.transition="";tilt2.style.transform="rotate(0deg)";}
          if(body2){body2.style.transition="";body2.style.transform="rotate(0deg)";}
        });
      });
    }
  },180);
}
function slosh(box,tilt,body,shift){
  var t=box.querySelector(".tilt"),b=box.querySelector(".body"),a=box.querySelector(".art");
  if(t)t.style.transform="rotate("+tilt+"deg)";
  if(b)b.style.transform="rotate("+body+"deg)";
  if(a)a.style.transform="translateX("+shift+"px)";
}
function bindSwipe(){
  var el=$("detailBox");if(!el)return;
  if(el._sw)return;            /* 只绑一次，避免每次重绘叠加监听 */
  el._sw=1;
  var x0=null,y0=null;
  el.addEventListener("touchstart",function(e){
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;
  },{passive:true});
  el.addEventListener("touchend",function(e){
    if(x0===null)return;
    var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    /* 横向位移够大且不是纵向滚动时才切换 */
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))swipe(dx<0?1:-1);
  });
}
function sizeHTML(b){
  return '<div class="sizebox" id="sizeArea">'+
    '<button class="'+(V.dsel===1?"on":"")+'" onclick="pickSize(1)">大杯 475ml<br><b style="color:var(--gold);font-size:16px">'+money(b.p)+'</b></button>'+
    (b.s?'<button class="'+(V.dsel===2?"on":"")+'" onclick="pickSize(2)">小杯 330ml<br><b style="color:var(--gold);font-size:16px">'+money(b.s)+'</b></button>':'')+
    '</div>';
}
function pickSize(n){
  V.dsel=n;var b=beerOf(V.detail);if(!b)return;
  var bs=$("sizeArea").querySelectorAll("button");
  for(var i=0;i<bs.length;i++)bs[i].classList.remove("on");
  if(bs[n-1])bs[n-1].classList.add("on");
}
function chgNum(d){
  V.num=Math.max(1,Math.min(99,(V.num||1)+d));
  var el=$("numVal");if(el)el.textContent=V.num;
}
function confirmAdd(id){
  var b=beerOf(id);if(!b)return;
  var size=V.dsel,price=size===1?b.p:b.s,n=V.num||1;
  if(size===2&&!b.s){size=1;price=b.p;}
  var exist=null;
  S.orders.forEach(function(o){if(o.st==="unpaid"&&o.beer===id&&o.size===size&&o.table===curTable()&&!o.note)exist=o;});
  if(exist)exist.qty+=n;
  else S.orders.unshift({oid:"O"+Date.now()+Math.floor(Math.random()*99),beer:id,size:size,price:price,qty:n,
    table:curTable(),ts:Date.now(),st:"unpaid",pay:"",mem:"",note:"",paidAmt:0});
  V.num=1;save();closeDetail();renderView();
  toast("已加入点单：" + b.n + " · " + (size===1?"大杯":"小杯") + " × " + n);
}
function renderTableSel(){
  var sel=$("tableSel");if(!sel)return;
  var cur=sel.value,h="";
  tables().forEach(function(t){h+='<option'+(t===cur?" selected":"")+'>'+esc(t)+'</option>';});
  sel.innerHTML=h;
  if(tables().indexOf(cur)<0)sel.value=tables()[0]||"";
}
function curTable(){return ($("tableSel")&&$("tableSel").value)||tables()[0]||"吧台";}
function cartList(){return S.orders.filter(function(o){return o.st==="unpaid"&&o.table===curTable();});}

/* ---- 顾客端：我的点单（不含金额与结账状态） ---- */
function openCart(){
  var list=cartList();
  var h='<button class="x" onclick="closeMem()">×</button><h3>我的点单</h3>';
  if(!list.length)h+='<p class="note">还没有点单，去挑一杯吧。</p>';
  list.forEach(function(o){
    var b=beerOf(o.beer);
    h+='<div class="row" style="align-items:center;border-bottom:1px solid var(--line);padding:8px 0">'+
      '<div style="width:40px">'+thumb(b?b.col:"#D98E1F",34)+'</div>'+
      '<div class="grow"><b>'+esc(b?b.n:"-")+'</b><div style="font-size:12px;color:var(--t3)">'+
      (o.size===1?"大杯 475ml":"小杯 330ml")+' × '+o.qty+'</div></div>'+
      '<button class="ghost" onclick="custDel(\''+o.oid+'\')">删除</button></div>';
  });
  $("memBox").innerHTML=h;$("memMask").classList.add("on");
}
function custDel(oid){delOrder(oid);openCart();}

/* ---- 隐藏入口 ---- */
var taps=0,tapT;
function brandTap(){
  taps++;clearTimeout(tapT);tapT=setTimeout(function(){taps=0;},1200);
  if(taps>=5){taps=0;toggleStaff();}
}
function enterStaff(){
  V.mode="staff";V.staffOpen=true;
  if(!V.tab)V.tab="order";
  $("segS").classList.add("on");$("segC").classList.remove("on");
  $("tableSel").style.display="none";$("cartBtn").style.display="none";
  window.scrollTo(0,0);renderAll();
}
function exitStaff(){
  V.mode="customer";
  $("segC").classList.add("on");$("segS").classList.remove("on");
  $("tableSel").style.display="";$("cartBtn").style.display="";
  window.scrollTo(0,0);renderAll();
}
/* 顾客端 / 店员端 一键互切：无需口令，点一下即到另一端 */
function setMode(m){if(m===V.mode)return;if(m==="staff")enterStaff();else exitStaff();}
function toggleStaff(){if(V.mode==="customer")enterStaff();else exitStaff();}
document.addEventListener("keydown",function(e){
  if(e.ctrlKey&&e.shiftKey&&(e.key==="A"||e.key==="a")){e.preventDefault();toggleStaff();}
});

/* 全量渲染：桌号下拉也要一起刷新，保证新增 / 改名 / 删除桌号后顾客端立即同步 */
function renderAll(){renderTabs();renderTableSel();renderView();}

/* ---- 启动 ---- */
(function init(){
  load();
  renderTableSel();
  $("tableSel").addEventListener("change",function(){renderView();});
  $("brand").addEventListener("click",brandTap);
  $("cartBtn").addEventListener("click",openCart);
  [$("detailMask"),$("payMask"),$("memMask"),$("bigMask")].forEach(function(m){
    m.addEventListener("click",function(e){if(e.target===m){m.classList.remove("on");
      if(m.id==="detailMask")V.detail=-1;
      if(m.id==="bigMask")renderView();}});
  });
  window.addEventListener("scroll",syncAnchor,{passive:true});
  setRange("近 7 天");
  V.tab="order";
  renderAll();
})();
</script>
</body>
</html>
